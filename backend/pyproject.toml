[tool.ruff]
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Security(...)` in argument defaults is the
# documented, idiomatic pattern — not the mutable-default footgun B008 warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
