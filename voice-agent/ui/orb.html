<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>REVVY Voice Agent</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05070a;
    overflow: hidden;
    font-family: "Segoe UI", -apple-system, sans-serif;
  }
  #root {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  canvas#orb-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .hud {
    position: absolute;
    color: #cfe0ff;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4c6ea8;
    margin-right: 8px;
    vertical-align: middle;
  }
  .dot.on { background: #2ee6a6; box-shadow: 0 0 6px rgba(46, 230, 166, 0.7); }
  .dot.busy { background: #ffcf6e; box-shadow: 0 0 6px rgba(255, 207, 110, 0.7); }

  #hud-top-left {
    top: 24px;
    left: 28px;
  }
  #system-label {
    font-weight: 600;
    color: #e8f0ff;
  }

  #hud-top-right {
    top: 24px;
    right: 28px;
    text-align: right;
  }
  #version-label {
    color: #8fb8ff;
    font-weight: 600;
  }
  #date-label {
    color: #4c6088;
    margin-top: 4px;
    font-size: 10px;
  }
  #last-query-label {
    color: #4c6088;
    margin-top: 14px;
    font-size: 10px;
    max-width: 260px;
    line-height: 1.5;
  }
  #last-query-label .tag {
    color: #6f86b8;
    display: block;
    margin-bottom: 2px;
  }
  #last-query-label .value {
    color: #8fb8ff;
    text-transform: none;
    letter-spacing: 0.2px;
  }

  #hud-status-panel {
    bottom: 32px;
    left: 28px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .status-row {
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .status-name {
    color: #d3e0ff;
    margin-right: 10px;
  }
  .status-value {
    color: #4c6088;
    font-weight: 600;
  }
  .status-value.on { color: #2ee6a6; }
  .status-value.busy { color: #ffcf6e; }

  #hud-chat-panel {
    top: 76px;
    bottom: 96px;
    right: 28px;
    width: 340px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(143, 184, 255, 0.18);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 8px 16px;
  }
  .chat-header {
    font-size: 10px;
    letter-spacing: 2px;
    color: #6f86b8;
    margin-bottom: 12px;
    flex: 0 0 auto;
  }
  #transcript {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
  }
  .line {
    font-size: 12.5px;
    line-height: 1.5;
    padding: 9px 11px;
    border-radius: 8px;
    animation: fade-in 0.3s ease;
    text-transform: none;
    letter-spacing: normal;
  }
  .line.you {
    background: rgba(143, 184, 255, 0.08);
    color: #cfe0ff;
  }
  .line.agent {
    background: rgba(46, 230, 166, 0.06);
    color: #d8fff0;
  }
  .line .role {
    display: block;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 4px;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #hud-input-row {
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
  }
  #text-input {
    width: 100%;
    background: rgba(143, 184, 255, 0.05);
    border: 1px solid rgba(143, 184, 255, 0.3);
    border-radius: 999px;
    padding: 12px 20px;
    color: #cfe0ff;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 0.5px;
    text-transform: none;
    outline: none;
    text-align: center;
  }
  #text-input::placeholder { color: #5c7099; }
  #text-input:focus { border-color: rgba(143, 184, 255, 0.6); }

  #graph-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 5, 8, 0.72);
    backdrop-filter: blur(6px);
    opacity: 1;
    transition: opacity 0.35s ease;
    z-index: 20;
  }
  #graph-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #graph-panel {
    position: relative;
    width: min(880px, 88vw);
    background: rgba(8, 12, 20, 0.6);
    border: 1px solid rgba(143, 184, 255, 0.2);
    border-radius: 16px;
    padding: 30px 34px 14px;
    box-shadow: 0 0 70px rgba(80, 130, 255, 0.1);
    transform: scale(1);
    transition: transform 0.35s ease;
  }
  #graph-overlay.hidden #graph-panel { transform: scale(0.96); }
  #graph-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: #8fb8ff;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  #graph-close:hover { color: #cfe0ff; }
  #graph-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: #6f86b8;
    text-align: center;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  #graph-svg { width: 100%; height: auto; display: block; }

  .edge {
    fill: none;
    stroke: rgba(110, 150, 220, 0.4);
    stroke-width: 2;
    stroke-dasharray: 6 8;
    animation: dash-flow 1.4s linear infinite;
    transition: stroke 0.25s ease, stroke-width 0.25s ease;
  }
  .edge.dashed { stroke-dasharray: 2 7; stroke: rgba(140, 140, 165, 0.32); }
  .edge.active {
    stroke: rgba(130, 235, 255, 0.95);
    stroke-width: 3;
    filter: drop-shadow(0 0 6px rgba(130, 235, 255, 0.85));
  }
  @keyframes dash-flow {
    to { stroke-dashoffset: -28; }
  }

  .node circle {
    fill: rgba(70, 110, 200, 0.22);
    stroke: rgba(143, 184, 255, 0.7);
    stroke-width: 1.5;
    transition: filter 0.25s ease, stroke 0.25s ease;
  }
  .node.hub circle { fill: rgba(120, 160, 255, 0.32); stroke: #cfe0ff; stroke-width: 2; }
  .node.small circle { fill: rgba(90, 90, 110, 0.22); stroke: rgba(140, 140, 165, 0.5); }
  .node.pulse circle {
    stroke: #ffffff;
    filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.9));
  }
  .node text {
    fill: #cfe0ff;
    font-size: 12px;
    font-family: "Segoe UI", sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
  }
  .node .sub {
    font-size: 8px;
    fill: #6f86b8;
    letter-spacing: 0.5px;
    text-transform: none;
  }
  .node.small text { font-size: 9px; }
</style>
</head>
<body>
<div id="root">
  <canvas id="orb-canvas"></canvas>

  <div id="hud-top-left" class="hud">
    <span id="system-dot" class="dot"></span><span id="system-label">INITIALIZING</span>
  </div>

  <div id="hud-top-right" class="hud">
    <div id="version-label">REVVY V1.0</div>
    <div id="date-label"></div>
    <div id="last-query-label"></div>
  </div>

  <div id="hud-status-panel" class="hud">
    <div class="status-row">
      <span id="dot-revit" class="dot"></span>
      <span class="status-name">REVIT MCP</span>
      <span id="val-revit" class="status-value">CONNECTING</span>
    </div>
    <div class="status-row">
      <span id="dot-code" class="dot"></span>
      <span class="status-name">BUILDING CODE</span>
      <span id="val-code" class="status-value">LOADING</span>
    </div>
    <div class="status-row">
      <span id="dot-wake" class="dot on"></span>
      <span class="status-name">WAKE WORD</span>
      <span id="val-wake" class="status-value on">--</span>
    </div>
    <div class="status-row">
      <span id="dot-agent" class="dot"></span>
      <span class="status-name">AGENT</span>
      <span id="state-text" class="status-value">IDLE</span>
    </div>
  </div>

  <div id="hud-chat-panel">
    <div class="chat-header">TRANSCRIPT</div>
    <div id="transcript"></div>
  </div>

  <div id="hud-input-row" class="hud">
    <input id="text-input" type="text" placeholder="Type a question for REVVY... (Enter)" autocomplete="off" />
  </div>

  <div id="graph-overlay" class="hidden">
    <div id="graph-panel">
      <button id="graph-close" aria-label="Close">&times;</button>
      <div id="graph-title">REVVY Architecture</div>
      <svg id="graph-svg" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="node-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <path id="edge-you-agent" class="edge" d="M450,96 L450,210"/>
        <path id="edge-agent-revitmcp" class="edge" d="M486,236 C 600,220 630,205 682,190"/>
        <path id="edge-revitmcp-model" class="edge" d="M752,182 L800,150"/>
        <path id="edge-agent-code" class="edge" d="M420,268 C 320,290 270,320 246,352"/>
        <path id="edge-code-tncdbr" class="edge" d="M196,384 L128,418"/>
        <path id="edge-agent-end" class="edge dashed" d="M450,290 L450,432"/>

        <g class="node" id="node-you">
          <circle cx="450" cy="70" r="26" filter="url(#node-glow)"/>
          <text x="450" y="75" text-anchor="middle">YOU</text>
        </g>

        <g class="node hub" id="node-agent">
          <circle cx="450" cy="250" r="42" filter="url(#node-glow)"/>
          <text x="450" y="245" text-anchor="middle">REVVY</text>
          <text x="450" y="261" text-anchor="middle" class="sub">gpt-realtime-mini</text>
        </g>

        <g class="node" id="node-revitmcp">
          <circle cx="715" cy="180" r="30" filter="url(#node-glow)"/>
          <text x="715" y="177" text-anchor="middle">REVIT MCP</text>
          <text x="715" y="191" text-anchor="middle" class="sub">tools</text>
        </g>
        <g class="node" id="node-model">
          <circle cx="815" cy="130" r="26" filter="url(#node-glow)"/>
          <text x="815" y="135" text-anchor="middle">MODEL</text>
        </g>

        <g class="node" id="node-code">
          <circle cx="220" cy="370" r="30" filter="url(#node-glow)"/>
          <text x="220" y="366" text-anchor="middle">CODE RAG</text>
          <text x="220" y="380" text-anchor="middle" class="sub">tool</text>
        </g>
        <g class="node" id="node-tncdbr">
          <circle cx="105" cy="435" r="26" filter="url(#node-glow)"/>
          <text x="105" y="440" text-anchor="middle">TNCDBR</text>
        </g>

        <g class="node small" id="node-end">
          <circle cx="450" cy="452" r="18" filter="url(#node-glow)"/>
          <text x="450" y="456" text-anchor="middle" class="sub">end / idle</text>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('orb-canvas');
const ctx = canvas.getContext('2d');
const root = document.getElementById('root');

let W, H, CX, CY;
function resize() {
  W = canvas.width = root.clientWidth;
  H = canvas.height = root.clientHeight;
  CX = W / 2;
  CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

const N_PARTICLES = 620;
const RADIUS = 150;

function fibonacciSphere(n) {
  const points = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = phi * i;
    points.push({
      x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 1.5 + Math.random() * 2.5,
    });
  }
  return points;
}
const basePoints = fibonacciSphere(N_PARTICLES);

// A faint, mostly-static starfield behind the orb -- pure atmosphere, no
// reactive behavior, drawn once per frame before the orb itself.
const N_STARS = 90;
const stars = Array.from({ length: N_STARS }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.2 + 0.3,
  phase: Math.random() * Math.PI * 2,
  speed: 0.3 + Math.random() * 0.6,
}));

// ---- Reactive state ----
const STATE_CONFIG = {
  idle:      { color: [110, 150, 220], rotSpeed: 0.06, jitter: 0.01, pulse: 0.025, radiusScale: 0.85 },
  listening: { color: [110, 190, 255], rotSpeed: 0.10, jitter: 0.02, pulse: 0.08, radiusScale: 1.0  },
  thinking:  { color: [170, 130, 255], rotSpeed: 0.35, jitter: 0.05, pulse: 0.04, radiusScale: 0.95 },
  speaking:  { color: [130, 255, 210], rotSpeed: 0.16, jitter: 0.03, pulse: 0.18, radiusScale: 1.05 },
};

// ---- Subtle cursor parallax ----
let targetTiltX = 0, targetTiltY = 0, tiltX = 0, tiltY = 0;
window.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  targetTiltX = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
  targetTiltY = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
});
let currentState = 'idle';
let transitionT = 1.0; // 0..1 crossfade progress into currentState
let prevConfig = STATE_CONFIG.idle;

window.setAgentState = function(state) {
  if (!STATE_CONFIG[state]) return;
  prevConfig = lerpConfig(prevConfig, STATE_CONFIG[currentState], 1); // snap prev to last actual
  currentState = state;
  transitionT = 0;

  const stateText = document.getElementById('state-text');
  const dotAgent = document.getElementById('dot-agent');
  stateText.textContent = state.toUpperCase();
  stateText.className = 'status-value' + (state === 'idle' ? '' : state === 'thinking' ? ' busy' : ' on');
  dotAgent.className = 'dot' + (state === 'idle' ? '' : state === 'thinking' ? ' busy' : ' on');
};

window.setSystemStatus = function(status) {
  const dotSystem = document.getElementById('system-dot');
  const systemLabel = document.getElementById('system-label');
  dotSystem.className = 'dot on';
  systemLabel.textContent = 'SYSTEM ONLINE';

  if (status.revit_mcp) {
    document.getElementById('dot-revit').className = 'dot on';
    document.getElementById('val-revit').className = 'status-value on';
    document.getElementById('val-revit').textContent = status.revit_mcp.toUpperCase();
  }
  if (status.building_code) {
    document.getElementById('dot-code').className = 'dot on';
    document.getElementById('val-code').className = 'status-value on';
    document.getElementById('val-code').textContent = status.building_code.toUpperCase();
  }
  if (status.wake_word) {
    document.getElementById('val-wake').textContent = status.wake_word.replace(/_/g, ' ').toUpperCase();
  }
};

window.setLastQuery = function(toolName, preview) {
  const el = document.getElementById('last-query-label');
  el.innerHTML = '';
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = 'LAST QUERY';
  const value = document.createElement('span');
  value.className = 'value';
  value.textContent = preview ? `${toolName}: "${preview}"` : toolName;
  el.appendChild(tag);
  el.appendChild(value);
  highlightForTool(toolName);
};

// ---- Architecture graph overlay ----
const graphOverlay = document.getElementById('graph-overlay');
let graphVisible = false;

window.toggleGraph = function() {
  graphVisible = !graphVisible;
  graphOverlay.classList.toggle('hidden', !graphVisible);
};

function closeGraph() {
  graphVisible = false;
  graphOverlay.classList.add('hidden');
}
document.getElementById('graph-close').addEventListener('click', closeGraph);
graphOverlay.addEventListener('click', (e) => {
  if (e.target === graphOverlay) closeGraph();
});

function pulseNode(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 750);
}
function pulseEdge(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 900);
}

// Real tool calls (from setLastQuery) light up the matching path through
// the diagram, so the graph doubles as a live activity view when open.
function highlightForTool(toolName) {
  if (!graphVisible || !toolName) return;
  pulseNode('node-agent');
  if (toolName === 'ask_building_code') {
    pulseEdge('edge-agent-code');
    pulseNode('node-code');
    pulseEdge('edge-code-tncdbr');
    pulseNode('node-tncdbr');
  } else {
    pulseEdge('edge-agent-revitmcp');
    pulseNode('node-revitmcp');
    pulseEdge('edge-revitmcp-model');
    pulseNode('node-model');
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpConfig(a, b, t) {
  return {
    color: [lerp(a.color[0], b.color[0], t), lerp(a.color[1], b.color[1], t), lerp(a.color[2], b.color[2], t)],
    rotSpeed: lerp(a.rotSpeed, b.rotSpeed, t),
    jitter: lerp(a.jitter, b.jitter, t),
    pulse: lerp(a.pulse, b.pulse, t),
    radiusScale: lerp(a.radiusScale, b.radiusScale, t),
  };
}

window.appendTranscriptLine = function(role, text) {
  const el = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'line ' + (role === 'you' ? 'you' : 'agent');
  const roleLabel = document.createElement('span');
  roleLabel.className = 'role';
  roleLabel.textContent = role === 'you' ? 'You' : 'REVVY';
  div.appendChild(roleLabel);
  div.appendChild(document.createTextNode(text));
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;

  if (graphVisible) {
    pulseEdge('edge-you-agent');
    pulseNode(role === 'you' ? 'node-you' : 'node-agent');
  }
};

const textInput = document.getElementById('text-input');
function submitTypedText() {
  const value = textInput.value.trim();
  if (!value) return;
  textInput.value = '';
  if (window.pywebview && window.pywebview.api && window.pywebview.api.submit_text) {
    window.pywebview.api.submit_text(value);
  }
}
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitTypedText();
});

function updateClock() {
  const now = new Date();
  const weekday = now.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
  const day = String(now.getDate()).padStart(2, '0');
  const month = now.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  const year = now.getFullYear();
  document.getElementById('date-label').textContent = `${weekday} ${day} ${month} ${year}`;
}
updateClock();
setInterval(updateClock, 30000);

let t = 0;
function animate() {
  t += 0.016;
  transitionT = Math.min(1, transitionT + 0.03);
  const cfg = lerpConfig(prevConfig, STATE_CONFIG[currentState], transitionT);
  tiltX = lerp(tiltX, targetTiltX, 0.04);
  tiltY = lerp(tiltY, targetTiltY, 0.04);

  // Trailing overdraw instead of a hard clear -- leaves soft motion
  // streaks behind moving particles rather than a flat wipe every frame.
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5, 7, 10, 0.28)';
  ctx.fillRect(0, 0, W, H);

  // Faint drifting starfield, well behind the orb.
  for (const s of stars) {
    const twinkle = 0.4 + 0.6 * Math.max(0, Math.sin(t * s.speed + s.phase));
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 200, 255, ${0.25 * twinkle})`;
    ctx.fill();
  }

  const angle = t * cfg.rotSpeed;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tiltCos = Math.cos(tiltX * 0.25), tiltSin = Math.sin(tiltX * 0.25);
  const pulseAmt = 1 + Math.sin(t * 4) * cfg.pulse;
  const r = RADIUS * cfg.radiusScale * pulseAmt;

  ctx.globalCompositeOperation = 'lighter';

  // Hot core + soft halo, layered for more punch than a single gradient.
  const coreGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, r * 0.35);
  coreGrad.addColorStop(0, `rgba(255, 255, 255, 0.35)`);
  coreGrad.addColorStop(0.4, `rgba(${cfg.color[0]}, ${cfg.color[1]}, ${cfg.color[2]}, 0.28)`);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, r * 0.35, 0, Math.PI * 2);
  ctx.fill();

  const haloGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, r * 1.1);
  haloGrad.addColorStop(0, `rgba(${cfg.color[0]}, ${cfg.color[1]}, ${cfg.color[2]}, 0.14)`);
  haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = haloGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, r * 1.1, 0, Math.PI * 2);
  ctx.fill();

  const projected = basePoints.map((p) => {
    // rotate around Y axis, then a slight X-axis tilt driven by the cursor
    const x1 = p.x * cosA - p.z * sinA;
    const z1 = p.x * sinA + p.z * cosA;
    const y = p.y * tiltCos - z1 * tiltSin + Math.sin(t * 2 + p.twinklePhase) * cfg.jitter;
    const z = p.y * tiltSin + z1 * tiltCos;

    const perspective = 400 / (400 - z * r);
    const px = CX + x1 * r * perspective;
    const py = CY + y * r * perspective;
    const twinkle = 0.6 + 0.4 * Math.sin(t * p.twinkleSpeed + p.twinklePhase);
    return { px, py, z, perspective, twinkle };
  });

  projected.sort((a, b) => a.z - b.z);

  // Particles additive-blended -- overlapping ones brighten naturally
  // instead of just stacking flat, opaque dots.
  for (const pt of projected) {
    const depthFactor = (pt.z + 1) / 2; // 0..1
    const size = Math.max(0.4, 1.5 * pt.perspective * (0.4 + depthFactor)) * (0.75 + 0.25 * pt.twinkle);
    const alpha = (0.2 + depthFactor * 0.6) * (0.6 + 0.4 * pt.twinkle);
    ctx.beginPath();
    ctx.arc(pt.px, pt.py, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${cfg.color[0]}, ${cfg.color[1]}, ${cfg.color[2]}, ${alpha})`;
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
