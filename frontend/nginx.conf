# frontend/nginx.conf
# Served by the nginx runtime stage in frontend/Dockerfile.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA fallback. index.html must always be revalidated --
    # without this, browsers heuristically cache it (nginx sends no
    # Cache-Control by default) and can keep serving a stale build
    # referencing an old JS bundle indefinitely, even across app restarts,
    # since it never has cause to ask the server again.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy API calls to the backend service (docker-compose network).
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
